name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zigbuild (linux aarch64 cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@cargo-zigbuild
      - name: Build
        run: |
          if command -v cargo-zigbuild >/dev/null; then
            cargo zigbuild --release -p torq --target ${{ matrix.target }}
          else
            cargo build --release -p torq --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/torq staging/torq
          tar -C staging -czf torq-${{ matrix.target }}.tar.gz torq
      - uses: actions/upload-artifact@v4
        with:
          name: torq-${{ matrix.target }}
          path: torq-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: torq-*
          merge-multiple: true
      - name: Write manifest.json
        run: |
          TAG="${{ github.ref_name }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" \
            --arg aarch64-apple-darwin "$BASE/torq-aarch64-apple-darwin.tar.gz" \
            --arg x86_64-apple-darwin "$BASE/torq-x86_64-apple-darwin.tar.gz" \
            --arg aarch64-unknown-linux-gnu "$BASE/torq-aarch64-unknown-linux-gnu.tar.gz" \
            --arg x86_64-unknown-linux-gnu "$BASE/torq-x86_64-unknown-linux-gnu.tar.gz" \
            '{version: $version, platforms: {
              "aarch64-apple-darwin": $aarch64-apple-darwin,
              "x86_64-apple-darwin": $x86_64-apple-darwin,
              "aarch64-unknown-linux-gnu": $aarch64-unknown-linux-gnu,
              "x86_64-unknown-linux-gnu": $x86_64-unknown-linux-gnu
            }}' > manifest.json
          cat manifest.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            manifest.json
          generate_release_notes: true
      - name: Publish crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: ./scripts/publish.sh
      - name: Update Homebrew tap
        if: env.TAP_PAT != ''
        env:
          TAP_PAT: ${{ secrets.TAP_PAT }}
          TAG: ${{ github.ref_name }}
        run: ./scripts/update-tap.sh artifacts "$TAG" "${{ github.repository }}"
