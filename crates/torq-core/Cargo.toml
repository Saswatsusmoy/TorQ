[package]
name = "torq-core"
description = "TorQ daemon core: engine wrapper, queue, persistence, REST API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
librqbit = { version = "8.1.1", default-features = false, features = ["rust-tls"] }
librqbit-core = { version = "5", default-features = false, features = ["sha1-ring"] }
buffers = { version = "4", package = "librqbit-buffers" }
axum.workspace = true
dirs.workspace = true
url.workspace = true
getrandom.workspace = true
futures.workspace = true
tokio-stream.workspace = true
notify.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
regex = "1"
base64.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-util = { version = "0.7", features = ["io"] }
torq-sources = { path = "../torq-sources", version = "0.1.9" }
